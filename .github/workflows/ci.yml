name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend build (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AgendaApi/AgendaApi.sln

      - name: Build
        run: dotnet build AgendaApi/AgendaApi.sln --configuration Release --no-restore

  # Separate job so it can be the required check on master; the frontend tests join it later
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Run backend unit tests
        run: dotnet test AgendaApi/AgendaApi.sln --configuration Release

  frontend:
    name: Frontend build (Vue/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: AgendaFrontend/yarn.lock

      - name: Install dependencies
        working-directory: AgendaFrontend
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Type-check and build
        working-directory: AgendaFrontend
        run: yarn build
