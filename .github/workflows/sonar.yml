name: SonarQube Cloud

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master

jobs:
  sonar:
    name: Analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Volledige history: Sonar gebruikt git blame om issues aan een auteur
          # en aan een datum te koppelen (nodig voor "new code").
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Cache SonarQube scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"SebastiaanvanOorschot_illAdvisedCalendarApp" \
            /o:"sebastiaanvanoorschot" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/TestResults/**,**/coverage/**" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="AgendaFrontend/coverage/lcov.info" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/__tests__/**,AgendaFrontend/src/main.ts,AgendaFrontend/vite.config.mts,AgendaFrontend/src/api/agenda-api-swagger.ts"

      - name: Build backend
        run: dotnet build AgendaApi/AgendaApi.sln --configuration Release

      # Alleen voor de coverage in Sonar; het blokkeren gebeurt in de "Unit tests" job van ci.yml
      - name: Collect coverage
        run: >
          dotnet test AgendaApi/AgendaApi.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: AgendaFrontend/yarn.lock

      # Ook alleen voor de coverage; de frontend tests blokkeren in dezelfde "Unit tests" job
      - name: Collect frontend coverage
        working-directory: AgendaFrontend
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn test:coverage

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
